name: Test shared production timers
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: production_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: integration-test-only
      PGDATABASE: production_test
    steps:
      - uses: actions/checkout@v4
      - name: Database isolation, economic budget, pause and idempotency
        run: psql -f supabase/tests/live_production.sql
      - name: Phase signatures, employee hours, overtime and Rome midnight
        run: psql -f supabase/tests/production_phases_hours.sql
      - name: Confirmed quote protection and owner audit
        run: psql -f supabase/tests/confirmed_estimates.sql
      - name: Concurrent starts on two tablets by one employee
        shell: bash
        run: |
          set -euo pipefail
          first="set request.jwt.claim.sub='00000000-0000-0000-0000-000000000002'; begin; select production_timer_action('10000000-0000-0000-0000-000000000001','j1','start'); select pg_sleep(2); commit;"
          second="set request.jwt.claim.sub='00000000-0000-0000-0000-000000000002'; select production_timer_action('10000000-0000-0000-0000-000000000001','j2','start');"
          psql -v ON_ERROR_STOP=1 -c "$first" > /tmp/start-first.log 2>&1 &
          first_pid=$!
          sleep 0.5
          if psql -v ON_ERROR_STOP=1 -c "$second" > /tmp/start-second.log 2>&1; then
            cat /tmp/start-second.log
            exit 1
          fi
          wait "$first_pid"
          grep 'Metti in pausa' /tmp/start-second.log
          psql -v ON_ERROR_STOP=1 -c "do \$\$begin if (select count(*) from production_live_segments where ended_at is null)<>1 then raise exception 'Concurrent duplicate'; end if; end\$\$;"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
